<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EcoSphere AI – Environmental Protection Chatbot</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <header class="app-header">
      <div class="brand">
        <div class="brand-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/>
            <path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/>
          </svg>
        </div>
        <div>
          <h1>EcoSphere AI</h1>
          <p class="subtitle">Environmental protection assistant</p>
        </div>
      </div>
      <button id="clear-btn" class="clear-btn" type="button" title="Clear conversation">Clear chat</button>
    </header>

    <section id="messages" class="messages" aria-live="polite"></section>

    <form id="chat-form" class="composer" autocomplete="off">
      <textarea
        id="user-input"
        class="composer-input"
        rows="1"
        maxlength="2000"
        placeholder="Ask about recycling, renewable energy, climate change..."
        aria-label="Type your message"
      ></textarea>
      <button id="send-btn" class="send-btn" type="submit">
        <span>Send</span>
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="22" y1="2" x2="11" y2="13"/>
          <polygon points="22 2 15 22 11 13 2 9 22 2"/>
        </svg>
      </button>
    </form>
  </main>

  <script src="app.js"></script>
</body>
</html>
